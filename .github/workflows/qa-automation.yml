name: QA Automation Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  BASE_URL: ${{ secrets.BASE_URL }}
  API_BASE_URL: ${{ secrets.API_BASE_URL }}
  TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
  TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: |
          cd tests
          npm ci

      - name: Run ESLint
        run: |
          cd tests
          npm run lint

      - name: Run TypeScript check
        run: |
          cd tests
          npm run typecheck

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    continue-on-error: true
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: |
          cd tests
          npm ci

      - name: Install Playwright browsers
        run: |
          cd tests
          npx playwright install --with-deps chromium

      - name: Run API tests
        run: |
          cd tests
          npx playwright test tests/api --reporter=list

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            tests/test-results
            tests/html-report
          retention-days: 7

  test-e2e:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    continue-on-error: true
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: |
          cd tests
          npm ci

      - name: Install Playwright browsers
        run: |
          cd tests
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        run: |
          cd tests
          npx playwright test tests/e2e --project=${{ matrix.browser }} --reporter=list

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.browser }}
          path: |
            tests/test-results
            tests/html-report
          retention-days: 7

  test-mobile:
    name: Mobile Tests (${{ matrix.device }})
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    continue-on-error: true
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        device: [Mobile Chrome, Mobile Safari]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: |
          cd tests
          npm ci

      - name: Install Playwright browsers
        run: |
          cd tests
          npx playwright install --with-deps

      - name: Run mobile tests
        run: |
          cd tests
          npx playwright test tests/e2e --project="${{ matrix.device }}" --reporter=list

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results-${{ matrix.device }}
          path: |
            tests/test-results
            tests/html-report
          retention-days: 7

  report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: [test-e2e, test-api, test-mobile]
    if: always()

    steps:
      - name: Generate test summary
        run: |
          echo "## QA Automation Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | Required |" >> $GITHUB_STEP_SUMMARY
          echo "| API Tests | continue-on-error |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests (chromium, firefox, webkit) | continue-on-error |" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile Tests (Chrome, Safari) | continue-on-error |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: E2E and API tests require a running backend server. Tests run locally against dev server." >> $GITHUB_STEP_SUMMARY
