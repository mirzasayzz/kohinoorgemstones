name: QA Automation Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  workflow_dispatch:
    inputs:
      testSuite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - e2e
          - api
          - auth
          - product
          - cart
          - checkout

env:
  NODE_VERSION: '20'
  BASE_URL: ${{ secrets.BASE_URL }}
  API_BASE_URL: ${{ secrets.API_BASE_URL }}
  TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
  TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: |
          cd tests
          npm ci

      - name: Run ESLint
        run: |
          cd tests
          npm run lint

      - name: Run TypeScript check
        run: |
          cd tests
          npm run typecheck

  test-e2e:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: |
          cd tests
          npm ci

      - name: Install Playwright browsers
        run: |
          cd tests
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        run: |
          cd tests
          npx playwright test tests/e2e --project=${{ matrix.browser }}
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.browser }}
          path: |
            tests/test-results
            tests/html-report
          retention-days: 7

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: tests/html-report
          retention-days: 7

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: |
          cd tests
          npm ci

      - name: Install Playwright browsers
        run: |
          cd tests
          npx playwright install --with-deps chromium

      - name: Run API tests
        run: |
          cd tests
          npx playwright test tests/api
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            tests/test-results
            tests/html-report
          retention-days: 7

  test-mobile:
    name: Mobile Tests (${{ matrix.device }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        device: [Mobile Chrome, Mobile Safari]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: |
          cd tests
          npm ci

      - name: Install Playwright browsers
        run: |
          cd tests
          npx playwright install --with-deps

      - name: Run mobile tests
        run: |
          cd tests
          npx playwright test tests/e2e --project="${{ matrix.device }}"
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results-${{ matrix.device }}
          path: |
            tests/test-results
            tests/html-report
          retention-days: 7

  report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: [test-e2e, test-api, test-mobile]
    if: always()

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: test-artifacts

      - name: Generate test summary
        run: |
          echo "## 🧪 QA Automation Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### E2E Tests" >> $GITHUB_STEP_SUMMARY
          for browser in chromium firefox webkit; do
            if [ -d "test-artifacts/e2e-results-$browser" ]; then
              echo "- **$browser**: Completed" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **$browser**: No results" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### API Tests" >> $GITHUB_STEP_SUMMARY
          if [ -d "test-artifacts/api-test-results" ]; then
            echo "- **API Tests**: Completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **API Tests**: No results" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Mobile Tests" >> $GITHUB_STEP_SUMMARY
          for device in "Mobile Chrome" "Mobile Safari"; do
            if [ -d "test-artifacts/mobile-test-results-$device" ]; then
              echo "- **$device**: Completed" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **$device**: No results" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let summary = '## 🧪 QA Automation Test Results\n\n';
            summary += '### E2E Tests\n';
            
            const browsers = ['chromium', 'firefox', 'webkit'];
            for (const browser of browsers) {
              const resultsPath = `test-artifacts/e2e-results-${browser}/test-results.json`;
              if (fs.existsSync(resultsPath)) {
                const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
                const stats = results.stats || {};
                summary += `- **${browser}**: ${stats.expected || 0} expected, ${stats.unexpected || 0} unexpected\n`;
              } else {
                summary += `- **${browser}**: No results\n`;
              }
            }
            
            summary += '\n### API Tests\n';
            const apiResultsPath = 'test-artifacts/api-test-results/test-results.json';
            if (fs.existsSync(apiResultsPath)) {
              const results = JSON.parse(fs.readFileSync(apiResultsPath, 'utf8'));
              const stats = results.stats || {};
              summary += `- **API**: ${stats.expected || 0} expected, ${stats.unexpected || 0} unexpected\n`;
            } else {
              summary += `- **API**: No results\n`;
            }
            
            summary += '\n### Mobile Tests\n';
            const devices = ['Mobile Chrome', 'Mobile Safari'];
            for (const device of devices) {
              const resultsPath = `test-artifacts/mobile-test-results-${device}/test-results.json`;
              if (fs.existsSync(resultsPath)) {
                const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
                const stats = results.stats || {};
                summary += `- **${device}**: ${stats.expected || 0} expected, ${stats.unexpected || 0} unexpected\n`;
              } else {
                summary += `- **${device}**: No results\n`;
              }
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-report
          path: test-artifacts
          retention-days: 30
